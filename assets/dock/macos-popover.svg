      <feComponentTransfer in="ambient-shadow" result="ambient">
        <feFuncA type="linear" slope="0.34"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="contact-blur"/>
      <feOffset in="contact-blur" dy="2" result="contact-shadow"/>
      <feComponentTransfer in="contact-shadow" result="contact">
        <feFuncA type="linear" slope="0.40"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="ambient"/>
        <feMergeNode in="contact"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

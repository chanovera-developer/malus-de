[package]
name = "malus-de-branches"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Branches - Explorador de archivos nativo de Malus DE (inspirado fielmente en macOS Finder)"

[[bin]]
name = "malus-de-branches"
path = "src/main.rs"

[dependencies]
malus-de-common = { workspace = true }
gtk4 = { workspace = true }
libadwaita = { workspace = true }
glib = { workspace = true }
gio = { workspace = true }
gdk-pixbuf = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }

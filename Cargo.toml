[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/dialogs",
    "crates/compositor",
    "crates/top-bar",
    "crates/dock",
    "crates/spotlight",
    "crates/notifications",
    "crates/session-lock",
    "crates/screenshot",
    "crates/link",
    "crates/wallpaper",
    "crates/ctl",
    "crates/settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MalusDE Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Dependencias internas del Workspace
malus-de-common = { path = "crates/common" }
malus-de-dialogs = { path = "crates/dialogs" }

# GUI & Shell
gtk4 = { version = "0.9", features = ["v4_12"] }
gdk-pixbuf = "0.20"
libadwaita = { version = "0.7", features = ["v1_5"] }
gtk4-layer-shell = "0.4"

# Wayland Compositor & Smithay
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_egl",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "backend_gbm",
    "renderer_glow",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
wayland-protocols-misc = { version = "0.3", features = ["client", "server"] }

# D-Bus & Ecosistema GNOME
zbus = { version = "4.2", default-features = false, features = ["async-io"] }
glib = "0.20"
gio = "0.20"

# Serialización & Configuración
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilidades & Rendimiento
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
async-channel = "2.3"


# Optimizaciones globales de compilación para Release
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
